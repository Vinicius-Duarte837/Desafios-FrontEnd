<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Profile card component</title>
</head>
<body>
  <div id="main">
    <img src="images/image-victor.jpg" alt="victor-profile-picture">
    <p><span id="name">Victor Crest</span><span id="age">26</span></p>
    <p id="location">London</p>
    <hr>
    <div id="social">
      <div>
        <p class="number">80K</p>
        <p class="social-desc">Followers</p>
      </div>
      <div>
        <p class="number">803K</p>
        <p class="social-desc">Likes</p>
      </div>
      <div>
        <p class="number">1.4K</p>
        <p class="social-desc">Photos</p>
      </div>
    </div>
  </div>
</body>
</html>
